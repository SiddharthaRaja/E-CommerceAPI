spring.application.name=commerceapi

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sid}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sidpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect