version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: commerce-postgres

    environment:
      POSTGRES_DB: commerce_db
      POSTGRES_USER: sid
      POSTGRES_PASSWORD: sidpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: commerce-backend

    ports:
      - "8081:8081"

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commerce_db
      SPRING_DATASOURCE_USERNAME: sid
      SPRING_DATASOURCE_PASSWORD: sidpassword

volumes:
  postgres_data: